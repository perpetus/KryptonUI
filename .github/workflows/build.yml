name: Build Windows UI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE*', 'COPYING*']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE*', 'COPYING*']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: KryptonUI revision to build
        type: string
        default: main
    outputs:
      commit:
        description: Exact KryptonUI commit used for the runtime
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

concurrency:
  group: ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: perpetus/KryptonUI
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - name: Record source revision
        id: revision
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not read UI commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-ninja
      - name: Build production runtime
        shell: pwsh
        run: ./tools/ci/build-runtime.ps1 -ArtifactDirectory "$env:RUNNER_TEMP/krypton-ui-runtime"
      - name: Upload runtime and ABI manifest
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-ui-runtime
          path: ${{ runner.temp }}/krypton-ui-runtime/
          if-no-files-found: error
          retention-days: 7
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: krypton-ui-logs
          path: out/ci/*.log
          if-no-files-found: ignore
          retention-days: 7
